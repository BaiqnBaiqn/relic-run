name: Validate and publish preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run check:sdk
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:submission
      - run: node tests/sandbox-browser.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/relic-run/.preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy simulated preview
        id: deployment
        uses: actions/deploy-pages@v4
